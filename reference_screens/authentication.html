<script>
  // Tab Switching Logic
  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');
  const indicator = document.getElementById('tab-indicator');
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const heading = document.getElementById('auth-heading');
  const subheading = document.getElementById('auth-subheading');
  const bottomText = document.getElementById('bottom-text');
  const bottomActionBtn = document.getElementById('bottom-action-btn');
  const formContainer = document.getElementById('form-container');

  // Adjust form container height dynamically
  const updateContainerHeight = () => {
    const activeForm = loginForm.classList.contains('opacity-0') ? signupForm : loginForm;
    formContainer.style.height = `${activeForm.scrollHeight}px`;
  };

  // Run on load and resize
  window.addEventListener('load', updateContainerHeight);
  window.addEventListener('resize', updateContainerHeight);

  function switchToLogin() {
    // UI Updates
    indicator.style.transform = 'translateX(0)';
    tabLogin.classList.remove('text-on-surface-variant');
    tabLogin.classList.add('text-primary');
    tabSignup.classList.remove('text-primary');
    tabSignup.classList.add('text-on-surface-variant');
    
    // Text Updates
    heading.textContent = 'Welcome Back';
    subheading.textContent = 'Secure access to your liquidity';
    bottomText.textContent = "Don't have an account?";
    bottomActionBtn.textContent = 'Sign Up';

    // Form Transitions
    signupForm.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
    signupForm.classList.remove('translate-x-0', 'opacity-100');
    
    setTimeout(() => {
      loginForm.classList.remove('-translate-x-full', 'opacity-0', 'pointer-events-none');
      loginForm.classList.add('translate-x-0', 'opacity-100');
      updateContainerHeight();
    }, 150); // slight delay for choreo
  }

  function switchToSignup() {
    // UI Updates
    indicator.style.transform = 'translateX(100%)';
    tabSignup.classList.remove('text-on-surface-variant');
    tabSignup.classList.add('text-primary');
    tabLogin.classList.remove('text-primary');
    tabLogin.classList.add('text-on-surface-variant');

    // Text Updates
    heading.textContent = 'Create Account';
    subheading.textContent = 'Start optimizing your cashflow';
    bottomText.textContent = "Already have an account?";
    bottomActionBtn.textContent = 'Login';

    // Form Transitions
    loginForm.classList.add('-translate-x-full', 'opacity-0', 'pointer-events-none');
    loginForm.classList.remove('translate-x-0', 'opacity-100');
    
    setTimeout(() => {
      signupForm.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
      signupForm.classList.add('translate-x-0', 'opacity-100');
      updateContainerHeight();
    }, 150);
  }

  tabLogin.addEventListener('click', switchToLogin);
  tabSignup.addEventListener('click', switchToSignup);
  
  // Link bottom action to tabs
  bottomActionBtn.addEventListener('click', () => {
    if (bottomActionBtn.textContent === 'Sign Up') {
      switchToSignup();
    } else {
      switchToLogin();
    }
  });

  // Password Visibility Toggle
  function togglePassword(inputId, btnElement) {
    const input = document.getElementById(inputId);
    const icon = btnElement.querySelector('span');
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
